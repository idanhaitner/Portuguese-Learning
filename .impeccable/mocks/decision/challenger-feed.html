<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Bricolage Grotesque",sans-serif;background:#0B0B0F;color:#fff;display:grid;grid-template-columns:260px 1fr 260px}
aside{padding:32px 24px;font-size:15px;color:#aaa;display:flex;flex-direction:column;gap:14px}
aside b{color:#fff;font-size:22px;margin-bottom:14px}
.card{margin:24px auto;width:500px;border-radius:28px;background:linear-gradient(#FF3B5C,#B0123A);position:relative;padding:40px;display:flex;flex-direction:column;justify-content:center}
.card h1{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:.9}
.card .tag{position:absolute;top:28px;left:40px;font-size:14px;opacity:.8}
.cap{position:absolute;left:40px;bottom:40px;right:110px;font-size:15px}
.cap b{display:block;font-size:13px;opacity:.75;margin-bottom:6px}
.rail{position:absolute;right:22px;bottom:40px;display:flex;flex-direction:column;gap:18px;align-items:center;font-size:12px}
.rail i{display:block;width:52px;height:52px;border-radius:50%;background:#ffffff26;margin-bottom:4px}
.next{padding:32px 24px;font-size:14px;color:#888}
.next div{background:#1a1a22;border-radius:16px;padding:16px;margin-top:12px;color:#ddd}
</style></head><body>
<aside><b>Português</b><span>For you</span><span>Subjects</span><span>Verbs</span><span>Progress</span></aside>
<div class="card">
<span class="tag">Time · Days of the week · 12 of 34</span>
<h1>segunda-<br>feira</h1>
<div class="cap"><b>Tap to reveal</b>A segunda-feira é o primeiro dia útil da semana.</div>
<div class="rail"><span><i></i>again</span><span><i></i>hard</span><span><i></i>good</span><span><i></i>easy</span></div>
</div>
<div class="next">Up next<div>ontem</div><div>falei</div><div>mais barato que</div></div>
</body></html>
