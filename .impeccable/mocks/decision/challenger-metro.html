<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Bricolage Grotesque",sans-serif;background:#000;color:#fff;padding:40px 0 0 56px}
.top{display:flex;gap:28px;font-size:15px;color:#888;margin-bottom:10px}
.top b{color:#fff;font-weight:500}
h1{font-size:220px;font-weight:200;letter-spacing:-.05em;line-height:.85;white-space:nowrap}
h2{font-size:48px;font-weight:200;margin:30px 0 16px;color:#00ABA9}
.grid{display:grid;grid-template-columns:repeat(6,170px);grid-auto-rows:170px;gap:8px}
.t{padding:14px;display:flex;flex-direction:column;justify-content:space-between;font-size:15px}
.t big{font-size:64px;font-weight:200;line-height:1}
.w2{grid-column:span 2}
.peek{position:absolute;left:1180px;top:330px;font-size:48px;font-weight:200;color:#555}
</style></head><body>
<div class="top"><b>today</b><span>subjects</span><span>verbs</span><span>progress</span></div>
<h1>boa tarde, 34 palavras</h1>
<h2>hoje</h2>
<div class="peek">assuntos</div>
<div class="grid">
<div class="t w2" style="background:#00ABA9"><span>review</span><big>34 due</big></div>
<div class="t" style="background:#E3008C"><span>practice</span><big>513</big></div>
<div class="t" style="background:#A4C400"><span>verbs</span><big>120</big></div>
<div class="t w2" style="background:#1BA1E2"><span>time · days of the week</span><big>segunda</big></div>
<div class="t" style="background:#F09609"><span>food and drink</span><big>12</big></div>
<div class="t" style="background:#6A00FF"><span>people</span><big>9</big></div>
<div class="t w2" style="background:#E51400"><span>grammar · past simple</span><big>falei</big></div>
<div class="t" style="background:#339933"><span>home</span><big>4</big></div>
<div class="t" style="background:#647687"><span>progress</span><big>38%</big></div>
</div>
</body></html>
